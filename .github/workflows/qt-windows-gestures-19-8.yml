name: Alencar Laser 19.8 - Qt Windows drawing gate
on:
  push:
    branches:
      - fix/curvas-tesoura-preflight-19-8-20261030
    paths:
      - DESENVOLVIMENTO/FONTE/qt/**
      - DESENVOLVIMENTO/FONTE/src/**
      - DESENVOLVIMENTO/FONTE/CMakeLists.txt
      - .github/workflows/qt-windows-gestures-19-8.yml
  pull_request:
    branches:
      - fix/validacao-real-19-8-20261029
    paths:
      - DESENVOLVIMENTO/FONTE/qt/**
      - DESENVOLVIMENTO/FONTE/src/**
      - DESENVOLVIMENTO/FONTE/CMakeLists.txt
      - .github/workflows/qt-windows-gestures-19-8.yml
permissions:
  contents: read
jobs:
  windows-qt6-gestures:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-minizip
            mingw-w64-ucrt-x86_64-zlib
      - name: Build actual Qt6 desktop target offline
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S DESENVOLVIMENTO/FONTE -B DESENVOLVIMENTO/FONTE/build_ci_qt_198 -G Ninja -DALENCAR_REQUIRE_QT=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/ucrt64
          cmake --build DESENVOLVIMENTO/FONTE/build_ci_qt_198 --parallel 2 --target alencar_test7_qt6
      - name: Test Bezier resize and abandoned-gesture recovery without hardware
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen
          mkdir -p DESENVOLVIMENTO/FONTE/build_ci_qt_198/gesture_results
          DESENVOLVIMENTO/FONTE/build_ci_qt_198/alencar_test7_qt6.exe --draw-join-19-8-test DESENVOLVIMENTO/FONTE/fixtures/web_nodes_normalized.csv DESENVOLVIMENTO/FONTE/build_ci_qt_198/gesture_results
          cat DESENVOLVIMENTO/FONTE/build_ci_qt_198/gesture_results/RESULTADO_DESENHO_UNIAO_19_8.json
