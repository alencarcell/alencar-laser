name: "Alencar Laser 19.8 - Offline C++ Regression"

on:
  push:
    branches:
      - feat/refino-curvas-rastreio-diagnosticos-19-8
    paths:
      - "DESENVOLVIMENTO/FONTE/src/**"
      - "DESENVOLVIMENTO/FONTE/tests/**"
      - ".github/workflows/preview-19-8-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-portable-core:
    name: "Portable simulator (no hardware)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install C++20 and Boost JSON headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libboost-json1.83-dev
      - name: Build and test motion, Fill, route
        shell: bash
        run: |
          set -euo pipefail
          cd DESENVOLVIMENTO/FONTE
          mkdir -p build-ci-offline
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic             tests/preview_motion_19_8_standalone.cpp             -o build-ci-offline/preview_motion
          build-ci-offline/preview_motion
          for target in preview_raster_19_8_standalone preview_route_19_8_standalone preview_draw_join_19_8_standalone text_alignment_19_8_standalone; do
            g++ -std=c++20 -O2 -Wall -Wextra -pedantic               "tests/${target}.cpp" -lboost_json -o "build-ci-offline/${target}"
            "build-ci-offline/${target}"
          done
          echo "PASS: C++20 offline only; Qt6/Windows/laser remain unvalidated."
